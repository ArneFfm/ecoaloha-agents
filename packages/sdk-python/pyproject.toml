[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ecoaloha"
version = "0.1.1"
description = "Official EcoAloha Python API client"
readme = "README.md"
requires-python = ">=3.10"

[project.urls]
Homepage = "https://ecoaloha.com"
Repository = "https://github.com/ArneFfm/ecoaloha-agents"
Documentation = "https://ecoaloha.com/developers"

[tool.setuptools]
py-modules = ["ecoaloha"]
