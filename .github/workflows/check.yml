name: Check integrations
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - run: python3 -m venv .venv
      - run: node --test packages/sdk-js/test/*.test.js
      - run: .venv/bin/python -m unittest discover -s packages/sdk-python
      - run: npm pack ./packages/sdk-js --dry-run
      - run: .venv/bin/python -m pip install build
      - run: .venv/bin/python -m build packages/sdk-python
